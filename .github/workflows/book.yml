name: Orange Book

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: /bin/bash -p -e -o pipefail {0}

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Orange Book / render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the manuscript
        run: /usr/bin/env -i HOME="$HOME" LANG=C LC_ALL=C PATH="$PATH" PYTHONHASHSEED=0 TZ=UTC python3 -S -P -B -X utf8 -W error::ResourceWarning tools/test_book_foundations.py

      - name: Render the manuscript
        run: /usr/bin/env -i HOME="$HOME" LANG=C LC_ALL=C PATH="$PATH" PYTHONHASHSEED=0 TZ=UTC python3 -S -P -B -X utf8 -W error::ResourceWarning tools/render_book.py

      - name: Upload the rendered book
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: orange-book
          path: build/book
          retention-days: 14
