name: Workflow Online Audit

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-online-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Workflow Online Audit / upstream metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Audit workflow source and upstream metadata
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          annotations: false
          online-audits: true
          persona: pedantic
          version: "1.26.1"
